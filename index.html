<!DOCTYPE html>
<html lang="zh-CN">
<head>

<!-- 社交分享预览。og:image 必须是绝对 URL，相对路径多数平台不认。
     部署后把 https://ivysuperman.github.io/instrument-quiz 替换成实际站点地址，例如 https://用户名.github.io/仓库名

<style>
/* ============================================================
   设计 token 全部取自 Figma 设计稿（file ndeh55dmRW8HJ4bkiIKFq2）
   不是目测调色，是从 Figma API 的 fills / style 字段读出的精确值
   ============================================================ */
:root{
  --bg:#F1EEE1;          /* 画布底色 */
  --ink:#575047;         /* 主文字 */
  --muted:#978774;       /* 次要文字 / 说明 */
  --band:#D9C9AD;        /* 按钮底、进度条槽、选项卡底 */
  --band-on:#A0947D;     /* 进度条已完成段 */
  --agree:#74978D;       /* 同意侧圆点（青） */
  --deny:#957497;        /* 不同意侧圆点（紫） */
  --hair:rgba(87,80,71,.14);
  --serif:"Songti TC","Songti SC","STSong","Noto Serif SC",serif;
  --sans:"PingFang TC","PingFang SC",-apple-system,BlinkMacSystemFont,
         "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:16px;              /* 设计稿统一圆角 */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:16px/1.75 var(--sans)}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
#app{max-width:430px;margin:0 auto;position:relative}
.scr{display:none;min-height:100dvh;min-height:100vh;padding:0 26px;
  padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.scr.on{display:block}

/* ---------- S0 开场 ---------- */
/* 设计稿首页铺了一张乐器线描底图（592x1052 覆盖整屏）。
   关键：Figma 里该图片填充的 opacity = 0.10，不是满不透明。
   照满不透明铺会把正文压得读不清，所以用独立图层精确还原这 10%。 */
#s0{display:none;flex-direction:column;min-height:100dvh;min-height:100vh;
  padding-top:calc(26px + env(safe-area-inset-top));
  background:var(--bg);position:relative;overflow:hidden}
#s0.on{display:flex}
#s0::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:url(assets/bg-instruments.jpg) center/cover no-repeat;
  opacity:.10}
#s0>*{position:relative;z-index:1}
.tit{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.4;
  text-align:center;color:var(--ink);margin-top:22vh}
.lede{font-size:14px;line-height:30px;text-align:center;color:var(--muted);
  margin-top:44px}
.lede p+p{margin-top:26px}
.btn{display:block;width:100%;height:58px;border:none;border-radius:var(--r);
  background:var(--band);color:var(--ink);font-size:18px;font-weight:500;
  letter-spacing:.3em;text-indent:.3em;font-family:var(--sans);cursor:pointer;
  transition:transform .16s,filter .16s}
.btn:active{transform:scale(.978);filter:brightness(.96)}
.btn.ghost{background:transparent;border:1px solid var(--band);
  color:var(--muted);letter-spacing:.12em;text-indent:.12em;font-size:15px}
.note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px}
/* ---------- 配对图鉴 ---------- */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pgi{background:rgba(255,255,255,.46);border-radius:11px;padding:6px 5px 8px;
  cursor:pointer;transition:transform .14s,background .14s;text-align:center}
.pgi:active{transform:scale(.95)}
.pgi.on{background:#E7DFC9}
/* 自己那一格标出来：不然"一个人的两把琴"会让人以为算错了 */
.pgi.self{box-shadow:inset 0 0 0 1.5px var(--band-on)}
.pgi img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:8px;
  display:block;background:rgba(255,255,255,.5)}
.pgi .rn{font-size:11px;line-height:1.35;margin-top:6px;color:var(--ink)}
.pgi .iname{font-size:9.5px;line-height:1.3;margin-top:2px;color:var(--muted)}
.pgdet{display:none;margin-top:14px;padding:15px 16px;border-radius:var(--r);
  background:rgba(217,201,173,.3)}
.pgdet.on{display:block}
.pgdet .rt{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.pgdet .rl{font-family:var(--serif);font-weight:700;font-size:21px;margin-top:5px}
.pgdet .rd{font-size:14px;line-height:1.9;margin-top:7px}
.pgdet .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pgdet .chips span{font-size:11px;padding:4px 10px;border-radius:20px;
  background:rgba(255,255,255,.5);color:var(--muted)}
.pgdet .chips span.df{background:#D9C9AD;color:var(--ink)}

/* ---------- 分享面板 ---------- */
/* 预览图用普通 <img>/<video> 直接渲染，不走 fetch ——
   微信内置浏览器屏蔽了 a[download]，navigator.share 也没有，
   那里唯一能存下来的办法就是长按图片。所以预览必须先出现、且永远可用，
   「下载 / 系统分享」只作为桌面与外部浏览器的增强。 */
.shbox{margin-top:18px;display:none}
.shbox.on{display:block}
/* 海报是 1080x1960，按容器满宽铺会占近两屏，一眼看不到全貌。
   限高让它整张可见 —— 长按保存拿到的是原始大图，与显示尺寸无关。 */
.shbox .pv{display:block;margin:0 auto;max-width:100%;max-height:66vh;
  width:auto;height:auto;border-radius:var(--r);
  background:rgba(255,255,255,.4);box-shadow:0 10px 30px rgba(87,80,71,.10)}
.shtip{font-size:13px;line-height:1.85;color:var(--muted);text-align:center;
  margin:14px 0 4px}
.shtip b{color:var(--ink);font-weight:500}
.shwarn{font-size:12px;line-height:1.8;color:var(--muted);text-align:center;
  background:rgba(217,201,173,.3);border-radius:10px;padding:10px 12px;margin-top:12px}
.s0foot{margin-top:auto;padding-top:40px}

/* ---------- S1 答题 ---------- */
#s1{padding-top:calc(30px + env(safe-area-inset-top))}
.chap{text-align:center;font-size:14px;color:var(--muted);margin-bottom:18px}
.bar{height:8px;background:var(--band);border-radius:var(--r);overflow:hidden}
.bar i{display:block;height:100%;min-width:20px;background:var(--band-on);
  border-radius:var(--r);width:0;transition:width .42s cubic-bezier(.4,0,.2,1)}
.back{display:block;background:none;border:none;color:var(--muted);
  font-size:14px;font-family:var(--sans);cursor:pointer;
  padding:15px 14px 15px 0;margin-bottom:50px;visibility:hidden}
.back.on{visibility:visible}
.qwrap{transition:opacity .2s,transform .2s}
.qwrap.out{opacity:0;transform:translateX(-24px)}
.qtxt{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.42;
  color:var(--ink);margin-bottom:12px;min-height:62px}
.qhint{font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:20px}
.lik{display:flex;flex-direction:column;gap:5px;margin-top:38px}
/* 选项卡：底色是 band 的 22% 透明度（设计稿原值） */
.lk{display:flex;align-items:center;width:100%;height:54px;padding:0 16px;
  background:rgba(217,201,173,.22);border:none;border-radius:var(--r);
  color:var(--ink);font-size:18px;letter-spacing:.1em;font-family:var(--sans);
  cursor:pointer;text-align:left;transition:background .16s,transform .13s}
.lk:active{transform:scale(.985)}
/* 选中态：设计稿注明「选项卡的背景和点点透明度变高」 */
.lk.sel{background:rgba(217,201,173,.62)}
.lk .dot{flex:0 0 auto;border-radius:50%;border:1px dashed;margin-right:14px;
  transition:opacity .16s,transform .16s}
.lk .lb{flex:1}
/* 圆点尺寸由档位强度决定：30 / 24 / 16 / 24 / 30（设计稿原值） */
.lk[data-v="2"]  .dot{width:30px;height:30px;border-color:var(--agree);
  background:rgba(116,151,141,.28);margin-left:0}
.lk[data-v="1"]  .dot{width:24px;height:24px;border-color:var(--agree);
  background:rgba(116,151,141,.16);margin-left:3px;margin-right:17px}
.lk[data-v="0"]  .dot{width:16px;height:16px;border-color:var(--muted);
  background:rgba(151,135,116,.13);margin-left:7px;margin-right:21px}
.lk[data-v="-1"] .dot{width:24px;height:24px;border-color:var(--deny);
  background:rgba(149,116,151,.16);margin-left:3px;margin-right:17px}
.lk[data-v="-2"] .dot{width:30px;height:30px;border-color:var(--deny);
  background:rgba(149,116,151,.28);margin-left:0}
.lk.sel .dot{transform:scale(1.06)}
.lk.sel[data-v="2"]  .dot{background:rgba(116,151,141,.55)}
.lk.sel[data-v="1"]  .dot{background:rgba(116,151,141,.38)}
.lk.sel[data-v="0"]  .dot{background:rgba(151,135,116,.34)}
.lk.sel[data-v="-1"] .dot{background:rgba(149,116,151,.38)}
.lk.sel[data-v="-2"] .dot{background:rgba(149,116,151,.55)}

/* ---------- S2 过场 ---------- */
#s2{display:none;flex-direction:column;justify-content:center;
  min-height:100dvh;min-height:100vh}
#s2.on{display:flex}
.axrow{margin-bottom:28px;opacity:0;transform:translateY(10px)}
.axrow.in{opacity:1;transform:none;transition:opacity .5s,transform .5s}
.axlbl{display:flex;justify-content:space-between;font-size:13px;
  color:var(--muted);margin-bottom:10px}
.axlbl b{font-weight:400}
.axlbl b.hit{color:var(--ink);font-weight:500}
.axbar{height:8px;background:var(--band);border-radius:var(--r);position:relative}
.axbar i{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;
  background:var(--band-on);left:50%;margin-left:-7px;
  transition:left .75s cubic-bezier(.4,0,.2,1)}
.load{text-align:center;font-size:13.5px;color:var(--muted);margin-top:38px}

/* ---------- S3 结果 ---------- */
/* 设计稿的结果页没有卡片容器，内容直接落在米色底上 */
#s3{padding-top:calc(30px + env(safe-area-inset-top))}
.rhead{text-align:center;font-size:18px;letter-spacing:.1em;color:var(--ink);
  margin-bottom:8px}
.rare{display:block;width:fit-content;margin:0 auto 14px;font-size:11.5px;
  letter-spacing:.18em;color:var(--muted);border:1px solid var(--band);
  border-radius:20px;padding:5px 14px}
.weakn{font-size:12.5px;line-height:1.85;color:var(--muted);
  background:rgba(217,201,173,.3);border-radius:12px;padding:12px 14px;
  margin-bottom:18px}
/* 插图是 3:4（1086x1448 的 2x 缩图 600x800），对应设计稿的 300x400。
   插图下方已烘焙乐器中文名与产地，所以结果页不再用 HTML 重复输出名字。 */
.rpic{width:100%;max-width:300px;margin:4px auto 0;aspect-ratio:3/4;
  position:relative}
.rpic img{width:100%;height:100%;object-fit:contain;display:block}
/* 播放键：设计稿把 24x24 的三角形放在插图右下、与烘焙的乐器名同一行 */
.play{position:absolute;right:-6px;top:74%;width:48px;height:48px;border:none;
  background:none;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:transform .14s}
.play:active{transform:scale(.9)}
.play .ic{width:24px;height:24px;position:relative;display:block}
.play .ic::before{content:"";position:absolute;left:5px;top:0;
  border-left:21px solid var(--muted);border-top:12px solid transparent;
  border-bottom:12px solid transparent}
.play.playing .ic::before{left:3px;top:1px;width:6px;height:22px;border:none;
  background:var(--muted);box-shadow:11px 0 0 var(--muted)}
.rmeta{text-align:center;font-size:12px;letter-spacing:.06em;color:var(--muted);
  margin-top:2px}
.sbar{height:3px;background:var(--band);border-radius:3px;overflow:hidden;
  margin-top:14px;opacity:0;transition:opacity .2s}
.sbar.on{opacity:1}
.sbar i{display:block;height:100%;width:0;background:var(--band-on)}
.rtit{font-family:var(--serif);font-weight:700;font-size:23px;color:var(--ink);
  text-align:center;margin-top:22px;letter-spacing:.04em}
.vd{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.85;
  color:var(--ink);padding:18px 0 24px;margin-bottom:6px;
  border-bottom:1px solid var(--hair)}
.sec{margin-top:28px}
.sh{font-size:12px;letter-spacing:.26em;color:var(--muted);margin-bottom:10px}
.sb{font-size:16px;line-height:28px;letter-spacing:.06em;color:var(--ink)}
.story{background:rgba(217,201,173,.32);border-radius:var(--r);
  padding:20px;margin-top:28px}
.story .st{font-family:var(--serif);font-weight:700;font-size:18px;
  line-height:1.5;color:var(--ink);margin-bottom:10px}
.story .sb{font-size:15.5px;line-height:27px}
.tv{background:rgba(217,201,173,.32);border-radius:12px;padding:16px;margin-top:14px}
.tv .sb{font-size:15px;line-height:26px}
/* 搭档卡是展示性的，不可点击。
   早先它点进去会 renderResult(搭档)，于是顶部还写着"和你最匹配的乐器是"，
   图和称号却换成了另一件乐器 —— 用户会以为自己的结果被改掉了。 */
.pt{display:flex;align-items:center;gap:14px;padding:14px;
  background:rgba(217,201,173,.32);border-radius:var(--r);
  cursor:default;user-select:none}
.pt img{width:52px;height:52px;object-fit:cover;border-radius:11px;flex:0 0 52px;
  background:rgba(255,255,255,.4);pointer-events:none}
.pt .pn{font-size:16px}
.pt .po{font-size:12px;color:var(--muted);margin-top:2px}
.axes{margin-top:30px;padding-top:26px;border-top:1px solid var(--hair)}
.cred{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:22px;
  padding-top:18px;border-top:1px solid var(--hair)}
.cred a{color:var(--agree)}
.cred summary{cursor:pointer;outline:none}
.acts{display:flex;flex-direction:column;gap:11px;margin-top:32px}
.foot{text-align:center;font-size:11.5px;color:var(--muted);
  margin-top:28px;line-height:1.95}

/* ---------- S4 图鉴 ---------- */
#s4{padding-top:calc(30px + env(safe-area-inset-top))}
.gh{font-family:var(--serif);font-weight:700;font-size:26px;margin-bottom:6px}
.gs{font-size:13.5px;color:var(--muted);margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.gi{background:rgba(217,201,173,.28);border-radius:13px;padding:10px 8px;
  text-align:center;cursor:pointer;transition:transform .14s,background .14s}
.gi:active{transform:scale(.96);background:rgba(217,201,173,.5)}
.gi img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;
  border-radius:9px;margin-bottom:7px;background:rgba(255,255,255,.5)}
/* height:auto 必须显式写。img 上有 height="240" 属性（为防布局抖动而加），
   它会生成一个确定的 used height，压过 aspect-ratio，导致缩略图被拉成竖条。 */
.gi .n{font-size:12.5px;line-height:1.4}
.gi .o{font-size:10.5px;color:var(--muted);margin-top:2px}
.gi.lock{opacity:.42}
.gi.lock img{filter:grayscale(1)}
.ghd{font-size:12px;letter-spacing:.24em;color:var(--muted);margin:32px 0 14px}
</style>
</head>

<div id="app">

<!-- S0 开场 -->
<section id="s0" class="scr on">
  <h1 class="tit">找到你的灵魂乐器</h1>
  <div class="lede">
    <p>世界上有一件乐器，<br>在你还不会形容自己的时候，<br>就已经在替你说话了。</p>
    <p>不同的乐器有不同的性格，<br>而某些乐器之间<br>可以产生最优美的共鸣。<br>看看谁是和你最天生一对的合奏者。</p>
  </div>
  <div class="s0foot">
    <button class="btn" id="go">开始测试</button>
    <div class="note" id="note"></div>

</section>

<!-- S1 答题 -->
<section id="s1" class="scr">
  <div class="chap" id="chap"></div>
  <div class="bar"><i id="pg"></i></div>
  <button class="back" id="bk">&lt; 上一题</button>
  <div class="qwrap" id="qw">
    <div class="qtxt" id="qt"></div>

<!-- S3 结果 -->
<section id="s3" class="scr"><div id="rc"></div></section>

<!-- S4 图鉴 -->
<section id="s4" class="scr">
  <div class="gh">十六种音色</div>
  <div class="gs">每一种都对应一件真实存在的乐器</div>
  <div class="grid" id="g1"></div>
  <div class="ghd">稀有音色 · 需要极端的偏好才能抵达</div>
  <div class="grid" id="g2"></div>
  <div style="height:26px"></div>
  <button class="btn ghost" id="gb">返回</button>
  <div style="height:24px"></div>

</div>

<script src="data.js"></script>
<script>
(function(){
'use strict';
var D=window.DATA, Q=D.questions, I=D.inst, AX=D.axes;
var st={i:0,ans:[],res:null};
var $=function(s){return document.querySelector(s)};

function show(id){
  ['s0','s1','s2','s3','s4'].forEach(function(k){
    document.getElementById(k).classList.toggle('on',k===id);
  });
  window.scrollTo(0,0);
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- 计分 ----------
   每题得分 = 档位(+2..-2) × 方向(dir) × 权重(w)
   每轴 6 题、权重 [1,1,1,1,2,2]，单轴区间 -16 ~ +16          */
function calc(ans){
  var s={R:0,E:0,S:0,T:0};
  ans.forEach(function(v,i){ s[Q[i].axis]+= v*Q[i].dir*Q[i].w });
  return s;
}
/* 五档必然产生 0 分（单轴约 7.8%）。硬归一侧会让那一轴变成掷硬币，
   所以分级打破平局：先看权重最高的题，再看其余题。 */
function sign(ans, axis){
  var qs=[], vs=[];
  Q.forEach(function(q,i){ if(q.axis===axis){ qs.push(q); vs.push(ans[i]) } });
  var total=0;
  for(var i=0;i<qs.length;i++) total += vs[i]*qs[i].dir*qs[i].w;
  if(total!==0) return total>0?1:-1;
  var mx=0;
  for(var m=0;m<qs.length;m++) if(qs[m].w>mx) mx=qs[m].w;
  var tie=0;
  for(var j=0;j<qs.length;j++) if(qs[j].w===mx) tie += vs[j]*qs[j].dir;
  if(tie!==0) return tie>0?1:-1;
  var t1=0;
  for(var k=0;k<qs.length;k++) if(qs[k].w<mx) t1 += vs[k]*qs[k].dir;
  return t1>=0?1:-1;
}
function code(ans){
  return (sign(ans,'R')>0?'L':'C')+(sign(ans,'E')>0?'O':'I')+
         (sign(ans,'S')>0?'S':'W')+(sign(ans,'T')>0?'B':'D');
}
/* 稀有款：强阈值 ±6（单轴满分 ±16），均衡型 |v|≤3
   24 题版按轴卷积测算：主结果 90.2%、稀有合计 9.80%，最冷稀有款 1.36% */
function rare(s){
  var K=['R','E','S','T'];
  var strong=K.filter(function(k){return Math.abs(s[k])>=6}).length;
  var weak  =K.filter(function(k){return Math.abs(s[k])<=3}).length;
  var pos   =K.filter(function(k){return s[k]>0}).length;
  if(weak===4&&pos===2) return 'ocarina';
  if(s.S<=-6&&strong>=3) return 'siku';
  if(s.R<=-6&&s.S>=6)   return 'jawharp';
  if(s.R>=6 &&s.E<=-6)  return 'glassharp';
  if(s.E<=-6&&s.T<=-6)  return 'hangdrum_bass';
  return null;
}
/* 乱答检测：全部选同一个档位，说明用户没认真作答。
   此时正反向题相互抵消，四轴都会归零，会误判成"均衡型"稀有款——
   而"均衡"应该是真实的无偏好，不是无效作答。故这种情况跳过稀有判定。 */
function isLazy(ans){
  var first=ans[0];
  for(var i=1;i<ans.length;i++) if(ans[i]!==first) return false;
  return true;
}
function resolve(ans){
  var s=calc(ans);
  var lazy=isLazy(ans);
  var r=lazy ? null : rare(s);
  /* 每轴正反向题的加权方向和为 0（完全平衡），所以全选同一档位时四轴必然全为 0，
     结果由打破平局逻辑给出。防刷是对的，但静默返回一个结果不够诚实，
     故标记 weak，在结果卡上提示区分度低、可重测。 */
  var weak = lazy || ['R','E','S','T'].every(function(k){return s[k]===0});
  /* mycode 要单独带出来：稀有款在数据里没有 code 字段，
     而配对图鉴必须知道"我"落在四轴的哪一格，否则测到稀有款的人就没有图鉴。 */
  return r ? {id:r,rare:true,sc:s,weak:false,mycode:code(ans)}
           : {id:D.map[code(ans)],rare:false,sc:s,weak:weak,mycode:code(ans)};
}

/* ---------- 配对图鉴 ----------
   16 件主乐器正好把四条轴的 16 种组合占满，所以拿"我的代号"和每件乐器的代号
   逐位比对，16 件乐器恰好对应 16 种关系，不重不漏（异或的结果必然互不相同）。
   5 件稀有款不作为图鉴里的格子 —— 它们不是四轴上的某一格，而是走到极端才出现的
   结果；但"我"的代号永远由答案算出，所以测到稀有款的人同样有完整图鉴。 */
var AXN={R:'共鸣方式',E:'能量形态',S:'结构关系',T:'情绪底色'};
var AXK=['R','E','S','T'];
var REL={
  m0 :{n:'一个人的两把琴', d:'四条轴完全一致。不用解释就懂彼此，但也容易一起钻进同一个盲区。'},
  m1 :{n:'余音与收尾',     d:'只差在共鸣方式：一个把事情放在心里反复听，一个说完就放下。'},
  m2 :{n:'台前与幕后',     d:'只差在能量形态：一个往外发声，一个往内收着，正好一个说一个听。'},
  m3 :{n:'两种安静',       d:'共鸣和能量都相反 —— 安静的方式不一样，但都不吵。'},
  m4 :{n:'主唱与和声',     d:'只差在结构关系：一个习惯定调，一个习惯把人接住。'},
  m5 :{n:'老友与新搭档',   d:'共鸣和结构相反：一个记着过去，一个把人凑在一起往前走。'},
  m6 :{n:'张罗的与垫底的', d:'能量和结构相反：一个在前面喊，一个在后面托。'},
  m7 :{n:'只在情绪上同频', d:'三条轴都相反，只有情绪底色一致 —— 做事方式差很远，情绪却对得上。'},
  m8 :{n:'白天与夜晚',     d:'只差在情绪底色：一个明亮欢腾，一个深沉苍远。'},
  m9 :{n:'记得的与往前的', d:'共鸣和情绪相反：一个反复回想，一个把劲头留给明天。'},
  m10:{n:'烟火与月光',     d:'能量和情绪相反：一个热闹外放，一个清冷内敛。'},
  m11:{n:'只在结构上同频', d:'三条轴都相反，只有面对一群人的方式一致。'},
  m12:{n:'拍板的与接住的', d:'结构和情绪相反：一个负责下决定，一个负责把气氛稳住。'},
  m13:{n:'只在能量上同频', d:'三条轴都相反，只有向外还是向内这一点一致。'},
  m14:{n:'只在共鸣上同频', d:'三条轴都相反，只有"事情过去之后还留多久"这一点一致。'},
  m15:{n:'正反两面',       d:'四条轴全部相反。彼此最完整的互补，也最需要耐心。'}
};
function relOf(a,b){
  var mask=0, diff=[];
  for(var i=0;i<4;i++) if(a.charAt(i)!==b.charAt(i)){ mask|=(1<<i); diff.push(AXK[i]) }
  return {key:'m'+mask, name:REL['m'+mask].n, desc:REL['m'+mask].d, diff:diff, mask:mask};
}
function bitCount(n){ var c=0; while(n){ c+=n&1; n>>=1 } return c }

/* 分享进入 / 图鉴进入时没有作答记录，退而用这件乐器自己的代号。
   稀有款两者都没有，此时整段图鉴不渲染 —— 不编一个假代号糊过去。 */
function myCodeOf(res){
  if(res && res.mycode) return res.mycode;
  var it=I[res.id];
  return (it && it.code) ? it.code : null;
}
function pairGalleryHtml(res){
  var mc=myCodeOf(res);
  if(!mc) return '';
  var cells=Object.keys(D.map).map(function(c){
    return { code:c, id:D.map[c], rel:relOf(mc,c) };
  }).sort(function(a,b){
    return bitCount(a.rel.mask)-bitCount(b.rel.mask) || a.rel.mask-b.rel.mask;
  });
  var h='<div class="blk"><div class="bh">配 对 图 鉴</div>'+
    '<div class="bb" style="font-size:13px;color:var(--muted);margin-bottom:12px">'+
    '把朋友测到的乐器在下面找出来，就知道你们俩凑在一起是什么关系。'+
    '从左上到右下，越来越互补。</div><div class="pgrid">';
  cells.forEach(function(x){
    var it=I[x.id];
    h+='<div class="pgi'+(x.id===res.id?' self':'')+'" data-k="'+x.rel.key+
       '" data-id="'+x.id+'">'+
       '<img src="img/'+x.id+'_t.jpg" alt="" loading="lazy" width="240" height="240">'+
       '<div class="rn">'+esc(x.rel.name)+'</div>'+
       '<div class="iname">'+esc(it.name_zh)+'</div></div>';
  });
  h+='</div><div class="pgdet" id="pgdet"></div></div>';
  return h;
}

/* ---------- 答题 ---------- */
function renderQ(){
  var q=Q[st.i];
  /* 设计稿顶部是「Chapter1 共鸣方式」。题目按 R→E→S→T 轮转，
     所以每 4 题为一轮 = 一个 Chapter，轴名随当前题变化。 */
  $('#chap').textContent='Chapter'+(Math.floor(st.i/4)+1)+'  '+AX[q.axis].name;
  $('#pg').style.width=((st.i+1)/Q.length*100)+'%';
  $('#bk').classList.toggle('on',st.i>0);
  $('#qt').textContent=q.q;
  var hint=$('#qh');
  hint.textContent=q.hint||'';
  hint.style.display=q.hint?'block':'none';
  var box=$('#lik'); box.innerHTML='';
  D.scale.forEach(function(o){
    var b=document.createElement('button');
    b.className='lk'+(st.ans[st.i]===o.v?' sel':'');
    b.setAttribute('data-v',o.v);
    b.innerHTML='<span class="dot"></span><span class="lb">'+o.label+'</span>';
    b.onclick=function(){ pick(o.v) };
    box.appendChild(b);
  });
}
function pick(v){
  st.ans[st.i]=v;
  // 先亮出选中态，再切题——否则用户看不到自己点了哪个
  var cur=$('.lk[data-v="'+v+'"]');
  if(cur) cur.classList.add('sel');
  var w=$('#qw');
  setTimeout(function(){
    w.classList.add('out');
    setTimeout(function(){
      st.i++;
      if(st.i>=Q.length){ w.classList.remove('out'); transit(); return; }
      renderQ(); w.classList.remove('out');
    },195);
  },140);
}
$('#bk').onclick=function(){
  if(st.i>0){ st.i--; renderQ(); }
};
$('#go').onclick=function(){ st.i=0; st.ans=[]; renderQ(); show('s1'); };

/* ---------- 过场 ---------- */
function transit(){
  st.res=resolve(st.ans);
  var s=st.res.sc;
  var box=$('#axc'); box.innerHTML='';
  ['R','E','S','T'].forEach(function(k,n){
    var a=AX[k], v=s[k];
    var d=document.createElement('div');
    d.className='axrow';
    d.innerHTML='<div class="axlbl"><b class="'+(v>0?'hit':'')+'">'+a.pos+
      '</b><b class="'+(v<0?'hit':'')+'">'+a.neg+'</b></div>'+
      '<div class="axbar"><i></i></div>';
    box.appendChild(d);
    setTimeout(function(){
      d.classList.add('in');
      // 单轴满分 ±16，映射到 6%..94%
      var pct=50+Math.max(-1,Math.min(1,v/16))*44;
      d.querySelector('i').style.left=pct+'%';
    },140*n+80);
  });
  $('#ld').textContent='正在校准你的音色…';
  show('s2');
  setTimeout(function(){ renderResult(st.res); show('s3'); },1750);
}

/* ---------- 音频 ---------- */
var au=null;
/* 用能力检测选格式，不做 UA 嗅探（UA 判断在微信/各家壳浏览器里极不可靠） */
var PREF=(function(){
  var a=document.createElement('audio');
  if(!a.canPlayType) return 'mp3';
  return a.canPlayType('audio/mp4;codecs="mp4a.40.2"') ? 'm4a' : 'mp3';
})();
function stopAudio(){
  if(au){ try{au.pause()}catch(e){} au.currentTime=0; au=null; }
  document.querySelectorAll('.play.playing').forEach(function(b){
    b.classList.remove('playing');
  });
  var sb=$('.sbar');
  if(sb){ sb.classList.remove('on'); sb.querySelector('i').style.width='0'; }
}
function bindAudio(btn,info){
  var tried=false;                    // 是否已回退过另一种格式
  var sb=$('.sbar'), fill=sb?sb.querySelector('i'):null;
  btn.onclick=function(){
    if(btn.classList.contains('playing')){ stopAudio(); return; }
    stopAudio();
    tried=false;
    au=new Audio();
    au.preload='none'; au.playsInline=true;
    au.src = PREF==='m4a' ? info.m4a : info.mp3;
    au.ontimeupdate=function(){
      if(au&&au.duration&&fill) fill.style.width=(au.currentTime/au.duration*100)+'%';
    };
    au.onended=stopAudio;
    au.onerror=function(){ fallback() };
    btn.classList.add('playing');
    if(sb) sb.classList.add('on');
    au.play().catch(onFail);

    function onFail(err){
      // 浏览器 autoplay 策略拦截 —— 不是文件问题，保留按钮让用户再点一次
      if(err && (err.name==='NotAllowedError' || err.name==='AbortError')){
        stopAudio();
        return;
      }
      fallback();
    }
    function fallback(){
      if(!tried && au){          // 首选格式失败 -> 换另一种再试
        tried=true;
        au.src = (PREF==='m4a') ? info.mp3 : info.m4a;
        au.play().catch(function(){ giveUp() });
      } else giveUp();
    }
    function giveUp(){           // 两种格式都放不了：隐藏按钮，卡片其余部分照常
      stopAudio();
      btn.style.display='none';
    }
  };
}

/* ---------- 分享 ---------- */
var IS_WX = /micromessenger/i.test(navigator.userAgent);
var TEST_URL = location.origin + location.pathname;   // 不带 #r=，扫码/点链接的人从头开始测

/* 把本地文件交给系统分享面板（iOS 15+ Safari 可直接「存储图像 / 存储视频」）。
   canShare({files}) 必须先问 —— 直接调 share() 在不支持 files 的浏览器上会抛错，
   而抛错时机在用户手势之后，补救不了。 */
function trySystemShare(url, filename, mime, title){
  if(!(window.File && navigator.canShare && navigator.share)) return Promise.resolve(false);
  return fetch(url).then(function(r){ return r.blob() }).then(function(b){
    var f=new File([b], filename, {type:mime});
    if(!navigator.canShare({files:[f]})) return false;
    return navigator.share({files:[f], title:title}).then(function(){return true},
                                                          function(){return true});
  }).catch(function(){ return false });   // file:// 下 fetch 会被拦，静默退回长按保存
}

function downloadFile(url, filename){
  var a=document.createElement('a');
  a.href=url; a.download=filename; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

function bindShare(it){
  var box=$('#shbox'), shown=null;

  function panel(kind){
    if(shown===kind){ box.classList.remove('on'); box.innerHTML=''; shown=null; return; }
    shown=kind;
    var isPic = kind==='pic';
    var src   = 'share/'+it.id+(isPic?'.jpg':'.mp4');
    var name  = '我的灵魂乐器-'+it.name_zh+(isPic?'.jpg':'.mp4');
    var h='';
    if(isPic){
      h+='<img class="pv" src="'+src+'" alt="'+esc(it.name_zh)+'分享图" width="1080" height="1960">';
      h+='<div class="shtip"><b>长按图片</b>即可保存到相册，或直接转发<br>'+
         '图里带二维码，别人扫一下就能测</div>';
    }else{
      h+='<video class="pv" src="'+src+'" poster="share/'+it.id+'.jpg" '+
         'controls playsinline preload="none" width="1080" height="1960"></video>';
      h+='<div class="shtip">一段 <b>10 秒的有声卡片</b>，存到相册会是一段视频<br>'+
         '放出来就能听见'+esc(it.name_zh)+'的声音</div>';
      if(IS_WX){
        h+='<div class="shwarn">微信里不能直接保存视频。'+
           '点右上角「···」→ 在浏览器打开，再回到这里保存。</div>';
      }
    }
    h+='<button class="btn ghost" id="shdo" style="margin-top:14px">'+
       (isPic?'用系统分享 / 下载图片':'用系统分享 / 下载视频')+'</button>';
    box.innerHTML=h; box.classList.add('on');

    $('#shdo').onclick=function(){
      var b=this, old=b.textContent;
      b.textContent='处理中…';
      trySystemShare(src, name, isPic?'image/jpeg':'video/mp4',
                     '找到你的灵魂乐器 · '+it.title)
        .then(function(ok){
          if(ok){ b.textContent=old; return; }
          if(IS_WX){ b.textContent = isPic?'请改用长按图片保存':'请先在浏览器中打开';
                     setTimeout(function(){b.textContent=old},2200); return; }
          downloadFile(src, name);
          b.textContent='已开始下载';
          setTimeout(function(){b.textContent=old},2000);
        });
    };
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  $('#shpic').onclick=function(){ panel('pic') };
  var m=$('#shmp4'); if(m) m.onclick=function(){ stopAudio(); panel('mp4') };

  $('#shlink').onclick=function(){
    var b=$('#shlink'), old=b.textContent;
    function done(txt){ b.textContent=txt; setTimeout(function(){b.textContent=old},1800) }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(TEST_URL).then(function(){ done('链接已复制') },
                                                   function(){ done(TEST_URL) });
    }else if(navigator.share){
      navigator.share({title:'找到你的灵魂乐器', text:it.verdict, url:TEST_URL})
        .catch(function(){});
    }else{
      done(TEST_URL);
    }
  };
}

/* ---------- 图鉴 ---------- */
function renderGallery(){
  var main=Object.keys(D.map).map(function(k){return D.map[k]});
  var rares=Object.keys(I).filter(function(k){return I[k].rare});
  function cell(id,lock){
    var it=I[id];
    return '<div class="gi'+(lock?' lock':'')+'" data-id="'+id+'">'+
      '<img src="img/'+id+'_t.jpg" alt="" loading="lazy" width="240" height="240">'+
      '<div class="n">'+esc(it.name_zh)+'</div>'+
      '<div class="o">'+esc(it.org||it.origin)+'</div></div>';
  }
  var seen=st.res?st.res.id:null;
  $('#g1').innerHTML=main.map(function(id){return cell(id,false)}).join('');
  $('#g2').innerHTML=rares.map(function(id){return cell(id,id!==seen)}).join('');
  document.querySelectorAll('.gi').forEach(function(el){
    el.onclick=function(){
      var id=el.dataset.id;
      stopAudio();
      renderResult({id:id,rare:!!I[id].rare,sc:st.res?st.res.sc:null});
      show('s3');
    };
  });
}
$('#gb').onclick=function(){ show(st.res?'s3':'s0'); };

/* ---------- hash 分享入口 ---------- */
function fromHash(){
  var m=(location.hash||'').match(/r=([a-z_]+)/i);
  if(m&&I[m[1]]){
    st.res={id:m[1],rare:!!I[m[1]].rare,sc:null};
    renderResult(st.res);
    // 被分享者看到的是别人的结果，给一个明确的自测入口
    var b=document.createElement('button');
    b.className='btn'; b.textContent='测测我自己的音色';
    b.onclick=function(){ stopAudio(); location.hash=''; show('s0'); };
    $('.acts').insertBefore(b,$('.acts').firstChild);
    show('s3');
    return true;
  }
  return false;
}
$('#note').textContent = Q.length + ' 个问题 · 约 ' + Math.round(Q.length*5/10)*10 + ' 秒';
if(!fromHash()) show('s0');
})();
